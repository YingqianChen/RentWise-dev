name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rentwise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rentwise_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      SECRET_KEY: ci-only-secret-key
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/rentwise_test
      OCR_PREWARM_ON_STARTUP: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.3
          uv pip install --system -r backend/requirements-dev.txt
      - name: Lint
        working-directory: backend
        run: ruff check app tests scripts
      - name: Test
        working-directory: backend
        run: pytest -q
      - name: Test real PostgreSQL flow
        working-directory: backend
        env:
          RUN_DB_INTEGRATION: "1"
        run: pytest tests/integration/test_db_flow.py -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Check and build
        working-directory: frontend
        run: npm run check
